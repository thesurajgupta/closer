[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "closer"
version = "1.0.0"
description = "An autonomous open-loop closure agent built on the Strands Agents SDK."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "CLOSER contributors" }]
keywords = ["agents", "strands", "bedrock", "agentcore", "automation"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "strands-agents==1.55.1",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]
aws = ["boto3>=1.35", "mangum>=0.17", "bedrock-agentcore>=0.1.0"]

[project.scripts]
closer = "closer.cli:main"

[project.urls]
Homepage = "https://github.com/closer-agent/closer"

[tool.setuptools.packages.find]
where = ["backend"]
include = ["closer*"]
